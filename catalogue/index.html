<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LU — Գիրք</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f7}body{display:flex;align-items:center;justify-content:center}#wrap{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}#book{margin:auto;filter:drop-shadow(0 15px 20px #0004)}.page{background:#faf9f5;overflow:hidden}.page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}.page:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 1px #0005}.stf__parent{touch-action:none}@media(max-width:600px){#wrap{width:100vw;height:100dvh}}#magnify{position:fixed;right:9px;top:9px;z-index:100;border:1px solid #bbb9ad;background:#fffE;border-radius:50%;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;color:#343c33}#magnify[aria-pressed=true]{background:#53634f;color:white}#glass{position:fixed;width:150px;height:150px;border:2px solid #fff;border-radius:50%;box-shadow:0 3px 16px #0006;pointer-events:none;z-index:99;background-color:#faf9f5;background-repeat:no-repeat;display:none}#shield{position:fixed;inset:0;z-index:90;touch-action:none;display:none;cursor:crosshair}body.magnifying #shield{display:block}</style></head><body><div id="wrap"><div id="book" role="region" aria-label="Թերթվող գիրք" tabindex="0"></div></div><button id="magnify" aria-label="Խոշորացույց" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6M10 7v6"/></svg></button><div id="shield"></div><div id="glass"></div><script src="page-flip.js"></script><script>
const book=document.getElementById('book');for(let n=1;n<=28;n++){const p=document.createElement('div');p.className='page';const i=document.createElement('img');i.src=`pages/${n}.webp`;i.alt=`Էջ ${n}`;i.draggable=false;p.append(i);book.append(p)}
const wrap=document.getElementById('wrap');const flip=new St.PageFlip(book,{width:1040,height:700,size:'stretch',minWidth:100,maxWidth:1400,minHeight:188,maxHeight:942,showCover:true,usePortrait:true,autoSize:false,drawShadow:true,maxShadowOpacity:.32,flippingTime:950,mobileScrollSupport:false,showPageCorners:true,disableFlipByClick:false});flip.loadFromHTML(document.querySelectorAll('.page'));
// Covers use the same flexible-paper motion as all interior pages.
for(let n=0;n<28;n++) flip.getPage(n).setDensity('soft');
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;const portrait=w<700;const pw=Math.min(w/(portrait?1:2),h*1040/700);book.style.width=(pw*(portrait?1:2))+'px';book.style.height=(pw*700/1040)+'px';flip.update()}fit();setTimeout(()=>flip.flipNext(),180);addEventListener('resize',fit);book.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();flip.flipNext()}if(e.key==='ArrowLeft'){e.preventDefault();flip.flipPrev()}});

const toggle=document.getElementById('magnify'),shield=document.getElementById('shield'),glass=document.getElementById('glass');let magnifying=false;
toggle.onclick=()=>{magnifying=!magnifying;document.body.classList.toggle('magnifying',magnifying);toggle.setAttribute('aria-pressed',magnifying);if(!magnifying)glass.style.display='none'};
function magnifyAt(e){e.preventDefault();const x=e.clientX,y=e.clientY;shield.style.display='none';const hit=document.elementFromPoint(x,y);shield.style.display='';const img=hit?.closest('.page')?.querySelector('img');if(!img||!img.naturalWidth){glass.style.display='none';return}const r=img.getBoundingClientRect(),scale=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale,ox=r.left+(r.width-w)/2,oy=r.top+(r.height-h)/2;if(x<ox||x>ox+w||y<oy||y>oy+h){glass.style.display='none';return}const zoom=2.8,size=Math.min(150,innerHeight-8,innerWidth-8),radius=size/2;glass.style.width=glass.style.height=size+'px';glass.style.left=Math.max(4,Math.min(innerWidth-size-4,x-radius))+'px';glass.style.top=Math.max(4,Math.min(innerHeight-size-4,y-radius-(e.pointerType==='touch'?60:0)))+'px';glass.style.backgroundImage='url("'+img.src+'")';glass.style.backgroundSize=(w*zoom)+'px '+(h*zoom)+'px';glass.style.backgroundPosition=(radius-(x-ox)*zoom)+'px '+(radius-(y-oy)*zoom)+'px';glass.style.display='block'}
shield.addEventListener('pointerdown',e=>{shield.setPointerCapture(e.pointerId);magnifyAt(e)});shield.addEventListener('pointermove',magnifyAt);shield.addEventListener('pointerleave',()=>glass.style.display='none');shield.addEventListener('pointerup',e=>{if(e.pointerType==='touch')glass.style.display='none'});shield.addEventListener('pointercancel',()=>glass.style.display='none');document.addEventListener('keydown',e=>{if(magnifying&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation()}if(e.key==='Escape'&&magnifying)toggle.click()},true);addEventListener('resize',()=>glass.style.display='none');
</script></body></html>
