<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LU — Գիրք</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f7}body{display:flex;align-items:center;justify-content:center}#wrap{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}#book{margin:auto;filter:drop-shadow(0 15px 20px #0004)}.page{background:#faf9f5;overflow:hidden}.page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}.page:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 1px #0005}.stf__parent{touch-action:none}@media(max-width:600px){#wrap{width:100vw;height:100dvh}}</style></head><body><div id="wrap"><div id="book" role="region" aria-label="Թերթվող գիրք" tabindex="0"></div></div><script src="page-flip.js"></script><script>
const book=document.getElementById('book');for(let n=1;n<=28;n++){const p=document.createElement('div');p.className='page';const i=document.createElement('img');i.src=`pages/${n}.webp`;i.alt=`Էջ ${n}`;i.draggable=false;p.append(i);book.append(p)}
const wrap=document.getElementById('wrap');const flip=new St.PageFlip(book,{width:1040,height:700,size:'stretch',minWidth:100,maxWidth:1400,minHeight:188,maxHeight:942,showCover:true,usePortrait:true,autoSize:false,drawShadow:true,maxShadowOpacity:.32,flippingTime:950,mobileScrollSupport:false,showPageCorners:true,disableFlipByClick:false});flip.loadFromHTML(document.querySelectorAll('.page'));
// Covers use the same flexible-paper motion as all interior pages.
for(let n=0;n<28;n++) flip.getPage(n).setDensity('soft');
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;const portrait=w<700;const pw=Math.min(w/(portrait?1:2),h*1040/700);book.style.width=(pw*(portrait?1:2))+'px';book.style.height=(pw*700/1040)+'px';flip.update()}fit();setTimeout(()=>flip.flipNext(),180);addEventListener('resize',fit);book.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();flip.flipNext()}if(e.key==='ArrowLeft'){e.preventDefault();flip.flipPrev()}});
</script></body></html>
